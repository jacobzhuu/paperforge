global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api-backend]
        type: A
        port: 8080
  - job_name: worker
    dns_sd_configs:
      - names: [worker, worker-short]
        type: A
        port: 9090
