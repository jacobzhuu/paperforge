name: Ubuntu compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * 6"

permissions:
  contents: read

jobs:
  lxd-compose-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: ["20.04", "22.04"]
    env:
      UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and initialize LXD
        run: |
          sudo snap list lxd >/dev/null 2>&1 || sudo snap install lxd --channel=5.21/stable
          sudo lxd init --minimal
      - name: Run nested Docker acceptance suite
        run: sudo --preserve-env=UBUNTU_PRO_TOKEN,GITHUB_RUN_ID ./scripts/compat/lxd-smoke "${{ matrix.release }}"
