name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-22.04
    services:
      # R1 白名单、bibtex_key 唯一性等不变量活在 SQL 里，契约测试跑真实 Postgres。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperforge
          POSTGRES_PASSWORD: paperforge
          POSTGRES_DB: paperforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAPERFORGE_TEST_DATABASE_URL: postgresql+asyncpg://paperforge:paperforge@localhost:5432/paperforge_test
    steps:
      - uses: actions/checkout@v4
      # visuald 用 graphviz 渲染示意图。不装的话 test_grouped_diagram_renders_all_formats
      # 会一直静默 skip——「带分组的示意图生成非法 DOT」正是这样躲过 CI 的。
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/pi/package-lock.json
      - name: Install Pi runtime for backend tests
        run: npm ci --omit=dev --ignore-scripts --prefix services/pi
      - name: Ruff
        run: uv run ruff check .
      # R16：领域词表必须住在 task_definition 行里。这条 lint 写好很久却从未被调用，
      # 于是 evidence.py 里的模型族/骨干/划分策略词表一路留到了 Phase 3。
      - name: Ontology literal lint
        run: uv run python scripts/ontology_literal_lint.py
      - name: Alembic migration
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://paperforge:paperforge@localhost:5432/paperforge
      - name: Migration drift check
        run: uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://paperforge:paperforge@localhost:5432/paperforge
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Browser contracts (controlled API, no paid calls)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  macos-host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Verify macOS/Bash 3.2 host paths
        run: |
          uv sync --all-packages --frozen
          uv run pytest -q services/api/tests/test_ops_scripts.py services/api/tests/test_storage_migration.py
          /bin/bash -n scripts/dev scripts/ops scripts/install-ubuntu-container-tools scripts/compat/compose-smoke scripts/compat/lxd-smoke
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Verify macOS Node workflow
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

  multiarch-images:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose compatibility
        env:
          PAPERFORGE_ENV_FILE: ${{ github.workspace }}/.env.production.example
        run: docker compose --env-file .env.production.example -f infra/docker-compose.prod.yml config --quiet
      - name: Build API for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 --target api --output type=cacheonly -f services/Dockerfile .
      - name: Build Worker with Pandoc for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 --target worker --output type=cacheonly -f services/Dockerfile .
      - name: Build Web for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly -f apps/web/Dockerfile .
