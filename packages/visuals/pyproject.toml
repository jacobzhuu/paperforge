[project]
name = "paperforge-visuals"
version = "0.1.0"
description = "PaperForge 结构化视觉规格、渲染客户端与图像 provider"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visuals"]
