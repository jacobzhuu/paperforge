[project]
name = "paper-ir"
version = "0.1.0"
description = "PaperForge PaperIR schema、引用样式、确定性 BibTeX、i18n"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pybtex>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_ir"]
