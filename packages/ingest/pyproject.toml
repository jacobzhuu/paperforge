[project]
name = "ingest"
version = "0.1.0"
description = "PaperForge 文档摄取：抽取、切块、section 感知选块"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pypdf>=6.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]
