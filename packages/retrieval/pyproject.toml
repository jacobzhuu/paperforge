[project]
name = "paperforge-retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["paperforge-db", "fastembed>=0.7,<1"]

[tool.uv.sources]
paperforge-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]
