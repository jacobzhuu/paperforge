[project]
name = "latex-render"
version = "0.1.0"
description = "PaperForge PaperIR → LaTeX 工程渲染、模板库、编译修复"
requires-python = ">=3.12"
dependencies = [
    "paperforge-observability",
    "paper-ir",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[tool.uv.sources]
paper-ir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latex_render"]
artifacts = ["latex_render/templates/*.j2"]
