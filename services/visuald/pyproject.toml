[project]
name = "paperforge-visuald"
version = "0.1.0"
description = "PaperForge 无外网确定性图表与示意图渲染沙箱"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "matplotlib==3.11.1",
    "pillow==12.3.0",
    "paperforge-visuals",
]

[tool.uv.sources]
paperforge-visuals = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperforge_visuald"]
