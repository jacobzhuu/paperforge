[project]
name = "paperforge-worker"
version = "0.1.0"
description = "PaperForge ARQ worker：各生成管线任务"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "paperforge-db",
    "paperforge-observability",
    "scholar-gateway",
    "ingest",
    "llm-runtime",
    "paper-ir",
    "latex-render",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
paperforge-db = { workspace = true }
paperforge-observability = { workspace = true }
scholar-gateway = { workspace = true }
ingest = { workspace = true }
llm-runtime = { workspace = true }
paper-ir = { workspace = true }
latex-render = { workspace = true }
paperforge-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperforge_worker"]
