[project]
name = "paperforge-worker"
version = "0.1.0"
description = "PaperForge ARQ worker：各生成管线任务"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "paperforge-db",
    "paperforge-observability",
    "scholar-gateway",
    "ingest",
    "llm-runtime",
    "paper-ir",
    "latex-render",
    "paperforge-storage",
    "paperforge-visuals",
    "psycopg[binary]>=3.2",
    "pypdfium2>=4.30,<5",
    # DOCX 导出把上传的 PDF 插图首页转成 PNG，走的是 pypdfium2 的 `bitmap.to_pil()`——
    # 它需要 Pillow，而 Pillow 此前只被 visuald 声明。运行镜像里因此没有 PIL，
    # `to_pil()` 抛的 AttributeError 又不在 `_pdf_first_page_png` 捕获的异常里，
    # 于是整份导出直接失败。
    "pillow==12.3.0",
]

[tool.uv.sources]
paperforge-db = { workspace = true }
paperforge-observability = { workspace = true }
scholar-gateway = { workspace = true }
ingest = { workspace = true }
llm-runtime = { workspace = true }
paper-ir = { workspace = true }
latex-render = { workspace = true }
paperforge-visuals = { workspace = true }
paperforge-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperforge_worker"]
